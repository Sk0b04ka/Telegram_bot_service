[tool.poetry]
name = "linktracker-bot"
version = "0.1.0"
description = "Telegram bot for LinkTracker project"
authors = ["Your Name"]
readme = "README.md"

packages = [
    { include = "bot", from = "src" }
]

[tool.poetry.dependencies]
python = "^3.12"
python-telegram-bot = "^20.7"

[tool.poetry.group.dev.dependencies]
black = "^24.8.0"
isort = "^5.13.2"
ruff = "^0.6.1"
pytest = "^8.0"
pytest-cov = "^5.0"
pytest-asyncio = "^0.23"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"