[tool.poetry]
name = "backend-academy-2026-python-template"
version = "0.1.0"
description = "Telegram bot for LinkTracker project"
authors = ["i.pankov <IvAlPankov@yandex.ru>"]
readme = "README.md"
package-mode = true

packages = [
    { include = "src" }
]


[tool.poetry.dependencies]
python = "^3.12"
python-telegram-bot = "^20.7"
structlog = "^25.5.0"
pydantic = "^2.12.5"
pydantic-settings = "^2.13.1"

[tool.poetry.group.dev.dependencies]
black = "^24.8.0"
isort = "^5.13.2"
ruff = "^0.6.1"
pytest = "^8.0"
pytest-cov = "^5.0"
pytest-asyncio = "^0.23"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
bot = "src.main:main"